<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Information Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2> Library Information Chatbot</h2>
            
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Hello! 👋 I am your chatbot.
                <br>
                You can ask me questions regarding  library services, VTU 5th Semester CSE subjects, books, and question papers.
            </div>
        </div>
        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                autocomplete="off"
            >
            <button id="sendButton">Send</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
